<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>東京リーグ UI案 比較</title>
    <link rel="stylesheet" href="./variants.css" />
  </head>
  <body class="variant-index-body">
    <main class="variant-index">
      <header class="variant-index-header">
        <p class="variant-eyebrow">Tokyo League Renewal</p>
        <img
          class="variant-logo"
          src="https://tokyo-league.jp/wp-content/themes/tokyo-league/assets/img/common/logo_head.svg"
          alt="東京リーグ ロゴ"
        />
        <h1>UIモック比較</h1>
        <p>
          既存寄りのモックはそのまま残し、別方向の3案を追加しています。すべて現サイトの画像やPDF導線を使う前提です。
        </p>
      </header>

      <section class="variant-index-grid">
        <a class="variant-link-card" href="./index.html">
          <span>既存寄り</span>
          <strong>Current Blend</strong>
          <p>今ある既存寄りモック。白基調で現サイトの雰囲気を維持。</p>
        </a>
        <a class="variant-link-card" href="./variant-a.html">
          <span>案A</span>
          <strong>Editorial Photo</strong>
          <p>写真を大きく使い、ニュースとチームの空気感を前面に出す構成。</p>
        </a>
        <a class="variant-link-card" href="./variant-b.html">
          <span>案B</span>
          <strong>Results First</strong>
          <p>リーグ結果と大会導線を最優先にした、情報整理寄りの構成。</p>
        </a>
        <a class="variant-link-card" href="./variant-c.html">
          <span>案C</span>
          <strong>Archive Portal</strong>
          <p>大会アーカイブ、PDF、年度切り替えを入口にしたポータル型。</p>
        </a>
      </section>
    </main>
  </body>
</html>
